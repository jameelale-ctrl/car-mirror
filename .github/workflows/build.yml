name: Build APK
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q CarMirror.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - run: gradle :app:assembleDebug
        working-directory: CarMirror
      - uses: actions/upload-artifact@v4
        with:
          name: CarMirror-debug-apk
          path: CarMirror/app/build/outputs/apk/debug/*.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Car Mirror build ${{ github.run_number }}
          make_latest: true
          files: CarMirror/app/build/outputs/apk/debug/*.apk
