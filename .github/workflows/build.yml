name: Build APKs
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - run: gradle :app:assembleDebug :photos:assembleDebug
      - name: Collect APKs
        run: |
          mkdir out
          cp app/build/outputs/apk/debug/app-debug.apk out/CarMirror.apk
          cp photos/build/outputs/apk/debug/photos-debug.apk out/CarPhotos.apk
      - uses: actions/upload-artifact@v4
        with:
          name: apks
          path: out/*.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Car apps build ${{ github.run_number }}
          make_latest: true
          files: out/*.apk
